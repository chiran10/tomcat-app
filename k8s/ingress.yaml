apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-app-ingress
  namespace: enterprise-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: enterprise.local
      http:
        paths:
          # Main app
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: tomcat-service
                port:
                  number: 8080

          # Hello world app
          - path: /hello
            pathType: Prefix
            backend:
              service:
                name: tomcat-helloworld-service
                port:
                  number: 8080
